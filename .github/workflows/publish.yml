name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11.5.1, the first version that supports OIDC
      # token exchange. Node 22 ships npm 10 and will fail.
      #
      # registry-url is deliberately NOT set: actions/setup-node would write an
      # .npmrc containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN},
      # and npm then prefers that (empty/placeholder) token over the OIDC
      # exchange, failing the publish with a 404 that hides the real 401.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      # OIDC token exchange needs npm >= 11.5.1; the npm bundled with the
      # Node 24 image can be older, which makes publish fail with ENEEDAUTH
      # (npm never tries the exchange and reports "not logged in").
      - name: Ensure npm supports OIDC
        run: |
          npm --version
          npm install -g npm@latest
          npm --version

      - name: Sanity check
        run: |
          node --check lib/client.js
          node -e "const p=require('./package.json'); if(!p.name||!p.version) process.exit(1)"

      # NODE_AUTH_TOKEN must be COMPLETELY ABSENT here, not an empty string:
      # npm only falls back to the OIDC exchange when no token is available.
      # Remove any .npmrc that could carry a stale token, then publish.
      - name: Publish to npm
        run: |
          rm -f "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc" .npmrc
          echo "oidc env: url=${ACTIONS_ID_TOKEN_REQUEST_URL:+set} token=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}"
          env -u NODE_AUTH_TOKEN -u NODE_AUTH -u NPM_TOKEN npm publish --provenance --access public --loglevel verbose
